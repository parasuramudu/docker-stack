version: '3.8'
networks:
  roboshop:
    driver: bridge
volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq:
services:
  catalogue:
    image: catalogue:v.01
    container_name: catalogue
    depends_on:
      - mongodb
  mongodb:
    image: mongodb:v.01
    container_name: mongodb
    volumes:
      - type: volume
        source: mongodb
        target: /data/db
        volume:
          nocopy: true
  redis:
    image: redis
    container_name: redis
    volumes:
      - type: volume
        source: redis
        target: /data
        volume:
          nocopy: true
  web:
    image: web:v.01
    container_name: web
    ports:
      - 80:80
    depends_on:
      - catalogue
      - user
      - cart
  user:
    image: user:v.01
    container_name: user
    depends_on:
      - mongodb
      - redis
  cart:
    image: cart:v.01
    container_name: cart
    depends_on:
      - catalogue
      - redis
           
  mysql:
    image: mysql:v.01
    container_name: mysql
    volumes:
      - type: volume
        source: mysql
        target: /var/lib/mysql
        volume:
          nocopy: true
  shipping:
    image: shipping:v.01
    container_name: shipping
    depends_on:
      - cart
      - mysql
  rabbitmq:
    image: rabbitmq
    container_name: rabbitmq
    volumes:
      - type: volume
        source: rabbitmq
        target: /var/lib/rabbitmq
        volume:
          nocopy: true
  payment:
    image: payment:v.01
    container_name: payment
    depends_on:
      - rabbitmq
      - cart
      - user
  ratings:
    image: ratings:v.01
    container_name: ratings
    depends_on:
      - mysql
